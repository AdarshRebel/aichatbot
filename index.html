<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>INSTALUGA Fashion AI</title>

  <!-- MARKDOWN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0f172a;
      --card: rgba(255, 255, 255, 0.05);
      --border: rgba(255, 255, 255, 0.08);
      --primary: #7c3aed;
      --secondary: #4f46e5;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    body {
      background:
        radial-gradient(circle at top,
          #1e1b4b,
          #020617);

      color: var(--text);

      font-family: Inter, Arial, sans-serif;

      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      overflow: hidden;
    }

    .app {
      width: 100%;
      max-width: 470px;
      height: 95vh;

      background: rgba(255, 255, 255, 0.04);

      backdrop-filter: blur(20px);

      border: 1px solid var(--border);

      border-radius: 28px;

      overflow: hidden;

      display: flex;
      flex-direction: column;

      box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.5);
    }

    /* ================= HEADER ================= */

    .header {
      padding: 18px 22px;

      display: flex;
      align-items: center;

      gap: 14px;

      border-bottom:
        1px solid var(--border);

      background:
        rgba(255, 255, 255, 0.03);
    }

    .logo {
      width: 52px;
      height: 52px;

      border-radius: 18px;

      background:
        linear-gradient(135deg,
          var(--primary),
          var(--secondary));

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 24px;

      box-shadow:
        0 0 30px rgba(124, 58, 237, .5);
    }

    .header h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .header p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
    }

    .online {
      margin-left: auto;

      display: flex;
      align-items: center;

      gap: 6px;

      font-size: 12px;

      color: #4ade80;
    }

    .dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;
      background: #4ade80;

      box-shadow: 0 0 10px #4ade80;
    }

    /* ================= MESSAGES ================= */

    .messages {
      flex: 1;

      overflow-y: auto;

      padding: 20px;

      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar {
      width: 5px;
    }

    .messages::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    .row {
      display: flex;
      margin-bottom: 18px;

      animation: fade .25s ease;
    }

    .row.user {
      justify-content: flex-end;
    }

    .bubble {
      max-width: 82%;

      padding: 14px 16px;

      border-radius: 20px;

      line-height: 1.7;

      font-size: 14px;
    }

    .bot {
      background:
        rgba(255, 255, 255, 0.06);

      border-top-left-radius: 6px;
    }

    .user-bubble {
      background:
        linear-gradient(135deg,
          var(--primary),
          var(--secondary));

      border-top-right-radius: 6px;
    }

    /* ================= PRODUCT CARD ================= */

    .product-card {
      margin-top: 14px;

      background:
        rgba(255, 255, 255, 0.04);

      border:
        1px solid rgba(255, 255, 255, 0.08);

      border-radius: 22px;

      overflow: hidden;

      transition: .25s;
    }

    .product-card:hover {
      transform: translateY(-4px);
    }

    .product-card img {
      width: 100%;
      height: 260px;
      object-fit: cover;
    }

    .product-content {
      padding: 16px;
    }

    .product-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .product-desc {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
    }

    .product-meta {
      margin-top: 12px;
      font-size: 13px;
      line-height: 1.8;
    }

    .price {
      margin-top: 12px;

      color: #4ade80;

      font-size: 20px;
      font-weight: 700;
    }

    .buy-btn {
      width: 100%;

      margin-top: 16px;

      padding: 13px;

      border: none;

      border-radius: 14px;

      background:
        linear-gradient(135deg,
          var(--primary),
          var(--secondary));

      color: white;

      font-weight: 600;

      cursor: pointer;

      transition: .2s;
    }

    .buy-btn:hover {
      opacity: .9;
      transform: scale(1.02);
    }

    /* ================= INPUT ================= */

    .input-area {
      padding: 18px;

      border-top:
        1px solid var(--border);

      display: flex;

      gap: 12px;

      background:
        rgba(255, 255, 255, 0.03);
    }

    textarea {
      flex: 1;

      resize: none;

      border: none;
      outline: none;

      background:
        rgba(255, 255, 255, 0.06);

      color: white;

      padding: 14px;

      border-radius: 16px;

      font-size: 14px;

      max-height: 120px;
    }

    textarea::placeholder {
      color: var(--muted);
    }

    button.send {
      width: 54px;
      height: 54px;

      border: none;

      border-radius: 18px;

      background:
        linear-gradient(135deg,
          var(--primary),
          var(--secondary));

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    button.send svg {
      width: 22px;
      fill: white;
    }

    /* ================= TYPING ================= */

    .typing {
      display: flex;
      gap: 6px;
    }

    .typing span {
      width: 8px;
      height: 8px;

      background: #94a3b8;

      border-radius: 50%;

      animation: bounce 1.2s infinite;
    }

    .typing span:nth-child(2) {
      animation-delay: .2s;
    }

    .typing span:nth-child(3) {
      animation-delay: .4s;
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: scale(.7);
        opacity: .5;
      }

      40% {
        transform: scale(1.2);
        opacity: 1;
      }
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media(max-width:600px) {
      .app {
        width: 100%;
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- HEADER -->

    <div class="header">

      <div class="logo">👕</div>

      <div>
        <h2>INSTALUGA</h2>
        <p>Luxury Streetwear AI Store</p>
      </div>

      <div class="online">
        <div class="dot"></div>
        Online
      </div>

    </div>

    <!-- MESSAGES -->

    <div class="messages" id="messages"></div>

    <!-- INPUT -->

    <div class="input-area">

      <textarea id="input" rows="1" placeholder="Ask about fashion, hoodies, outfits..."></textarea>

      <button class="send" id="sendBtn">

        <svg viewBox="0 0 24 24">
          <path d="M2 21L23 12 2 3v7l15 2-15 2z" />
        </svg>

      </button>

    </div>

  </div>

  <script>

    // ================= API =================

    const API_KEY =
      "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";

    const MODEL =
      "llama-3.1-8b-instant";

    // ================= PRODUCTS =================

    const products = [

      {
        name:
          "Oversized Black Hoodie",

        price:
          "$49",

        image:
          "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab",

        sizes:
          ["S", "M", "L", "XL"],

        colors:
          ["Black", "White"],

        desc:
          "Premium heavyweight oversized hoodie for urban streetwear."
      },

      {
        name:
          "INSTALUGA Graphic Tee",

        price:
          "$29",

        image:
          "https://images.unsplash.com/photo-1503342217505-b0a15ec3261c",

        sizes:
          ["S", "M", "L"],

        colors:
          ["White", "Cream"],

        desc:
          "Soft premium cotton t-shirt with luxury street graphics."
      },

      {
        name:
          "Street Cargo Pants",

        price:
          "$59",

        image:
          "https://images.unsplash.com/photo-1515886657613-9f3515b0c78f",

        sizes:
          ["30", "32", "34"],

        colors:
          ["Black", "Gray"],

        desc:
          "Relaxed fit cargo pants with modern urban styling."
      }

    ];

    // ================= ELEMENTS =================

    const messages =
      document.getElementById("messages");

    const input =
      document.getElementById("input");

    const sendBtn =
      document.getElementById("sendBtn");

    // ================= HISTORY =================

    let history = [

      {
        role: "system",

        content: `
You are INSTALUGA AI.

You are a luxury streetwear fashion assistant.

Help users:
- choose outfits
- recommend clothing
- explain fashion trends
- suggest sizes
- promote products naturally

Keep responses stylish,
modern, concise, and friendly.
`
      }

    ];

    // ================= AUTO RESIZE =================

    input.addEventListener("input", () => {

      input.style.height = "auto";

      input.style.height =
        Math.min(input.scrollHeight, 120)
        + "px";
    });

    // ================= ENTER SEND =================

    input.addEventListener("keydown", e => {

      if (e.key === "Enter"
        && !e.shiftKey) {

        e.preventDefault();

        sendMessage();
      }
    });

    sendBtn.addEventListener(
      "click",
      sendMessage
    );

    // ================= ADD MESSAGE =================

    function addMessage(role, text) {

      const row =
        document.createElement("div");

      row.className =
        `row ${role}`;

      const bubble =
        document.createElement("div");

      bubble.className =
        `bubble ${role === "user"
          ? "user-bubble"
          : "bot"
        }`;

      if (role === "bot") {
        bubble.innerHTML =
          marked.parse(text);
      } else {
        bubble.textContent = text;
      }

      row.appendChild(bubble);

      messages.appendChild(row);

      messages.scrollTop =
        messages.scrollHeight;
    }

    // ================= SHOW PRODUCTS =================

    function showProducts() {

      products.forEach(product => {

        const row =
          document.createElement("div");

        row.className = "row";

        row.innerHTML = `
<div class="bubble bot">

  <div class="product-card">

    <img src="${product.image}">

    <div class="product-content">

      <div class="product-title">
        ${product.name}
      </div>

      <div class="product-desc">
        ${product.desc}
      </div>

      <div class="product-meta">

        Sizes:
        ${product.sizes.join(", ")}

        <br>

        Colors:
        ${product.colors.join(", ")}

      </div>

      <div class="price">
        ${product.price}
      </div>

      <button class="buy-btn">
        Add To Cart
      </button>

    </div>

  </div>

</div>
`;

        messages.appendChild(row);
      });

      messages.scrollTop =
        messages.scrollHeight;
    }

    // ================= TYPING =================

    function typing() {

      const row =
        document.createElement("div");

      row.className = "row";

      row.id = "typing";

      row.innerHTML = `
<div class="bubble bot">
  <div class="typing">
    <span></span>
    <span></span>
    <span></span>
  </div>
</div>
`;

      messages.appendChild(row);

      messages.scrollTop =
        messages.scrollHeight;
    }

    function removeTyping() {

      const t =
        document.getElementById("typing");

      if (t) t.remove();
    }

    // ================= SEND =================

    async function sendMessage() {

      const text =
        input.value.trim();

      if (!text) return;

      addMessage("user", text);

      history.push({
        role: "user",
        content: text
      });

      input.value = "";
      input.style.height = "auto";

      sendBtn.disabled = true;

      typing();

      try {

        const response =
          await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "Authorization":
                  `Bearer ${API_KEY}`
              },

              body: JSON.stringify({

                model: MODEL,

                temperature: 0.7,

                max_tokens: 1500,

                messages: history

              })

            }
          );

        if (!response.ok) {

          const err =
            await response.json();

          throw new Error(
            err.error?.message
          );
        }

        const data =
          await response.json();

        const reply =
          data.choices[0]
            .message.content;

        removeTyping();

        addMessage(
          "bot",
          reply
        );

        history.push({
          role: "assistant",
          content: reply
        });

      } catch (err) {

        removeTyping();

        addMessage(
          "bot",
          `⚠️ ${err.message}`
        );
      }

      sendBtn.disabled = false;

      input.focus();
    }

    // ================= WELCOME =================

    addMessage(
      "bot",
      `
# 👕 Welcome to INSTALUGA

Luxury Streetwear Meets AI Fashion.

You can ask:

- Show hoodies
- Summer outfits
- Oversized fashion
- Black streetwear
- Trending styles
- Best fits

Explore our latest collection below.
`
    );

    showProducts();

  </script>

</body>

</html>
